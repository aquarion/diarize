[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarize-mcp"
version = "0.1.0"
description = "MCP server for the diarize tool"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.0 renamed FastMCP to MCPServer and changed other APIs this
    # server relies on (see server.py's `from mcp.server.fastmcp import
    # FastMCP`) - pin below it until that migration happens, so a fresh
    # `uv sync`/`uv lock` can't silently jump to a breaking major version.
    "mcp>=1.0,<2",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
pythonpath = ["."]
